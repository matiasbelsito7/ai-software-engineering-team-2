```yaml
name: Tests

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ##########################################################################
  # Unit Tests
  ##########################################################################

  unit-tests:

    name: Unit Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run unit tests
        run: make test-unit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  ##########################################################################
  # Integration Tests
  ##########################################################################

  integration-tests:

    name: Integration Tests

    needs: unit-tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    if: false

    steps:

      - name: Placeholder
        run: echo "Integration tests will be enabled when infrastructure is implemented."
```
