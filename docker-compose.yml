services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      - APP_ENVIRONMENT=development
      - APP_DEBUG=true
      - LLM__PROVIDER=ollama
      - LLM__OLLAMA__BASE_URL=http://ollama:11434
      - REDIS__HOST=redis
      - REDIS__PORT=6379
      - QDRANT__HOST=qdrant
      - QDRANT__PORT=6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped
    networks:
      - ai-team

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-team

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-team

volumes:
  redis-data:
  qdrant-data:

networks:
  ai-team:
    driver: bridge
