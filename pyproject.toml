###############################################################################
# Build System
###############################################################################

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

###############################################################################
# Project Metadata (PEP 621)
###############################################################################

[project]
name = "ai-software-engineering-team"
version = "0.1.0"
description = "Production-grade multi-agent AI Software Engineering Team built with LangGraph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Matias Belsito" }
]

keywords = [
    "artificial-intelligence",
    "llm",
    "agents",
    "langgraph",
    "rag",
    "software-engineering",
    "fastapi",
    "python",
    "multi-agent",
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",

    "Framework :: FastAPI",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

###############################################################################
# Runtime Dependencies
###############################################################################

dependencies = [

    ###########################################################################
    # API
    ###########################################################################

    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    ###########################################################################
    # AI Orchestration
    ###########################################################################

    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",

    ###########################################################################
    # LlamaIndex
    ###########################################################################

    "llama-index>=0.13.0",
    "llama-index-vector-stores-qdrant>=0.8.0",
    "llama-index-embeddings-ollama>=0.6.0",

    ###########################################################################
    # LLM Providers
    ###########################################################################

    "openai>=1.99.0",
    "anthropic>=0.64.0",

    ###########################################################################
    # Database
    ###########################################################################

    "sqlalchemy>=2.0.43",
    "asyncpg>=0.30.0",
    "alembic>=1.16.4",

    ###########################################################################
    # Cache / Memory
    ###########################################################################

    "redis>=6.4.0",

    ###########################################################################
    # Vector Database
    ###########################################################################

    "qdrant-client>=1.15.1",

    ###########################################################################
    # Configuration
    ###########################################################################

    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",

    ###########################################################################
    # Networking
    ###########################################################################

    "httpx>=0.28.1",

    ###########################################################################
    # Logging
    ###########################################################################

    "structlog>=25.4.0",

    ###########################################################################
    # Observability
    ###########################################################################

    "opentelemetry-api>=1.36.0",
    "opentelemetry-sdk>=1.36.0",
    "langsmith>=0.4.14",

    ###########################################################################
    # Evaluation
    ###########################################################################

    "deepeval>=3.5.0",

    ###########################################################################
    # Utilities
    ###########################################################################

    "python-dotenv>=1.1.1",
    "PyYAML>=6.0.2",
    "tenacity>=9.1.2",
    "orjson>=3.11.2",
    "rich>=14.1.0",
    "typer>=0.16.0",
]

###############################################################################
# Development Dependencies (uv)
###############################################################################

[dependency-groups]

dev = [

    ###########################################################################
    # Testing
    ###########################################################################

    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",

    ###########################################################################
    # Code Quality
    ###########################################################################

    "ruff>=0.12.8",
    "black>=25.1.0",
    "mypy>=1.17.1",

    ###########################################################################
    # Type Stubs
    ###########################################################################

    "types-PyYAML",
    "types-redis",

    ###########################################################################
    # Development
    ###########################################################################

    "ipython>=9.4.0",
    "pre-commit>=4.3.0",
]

###############################################################################
# Project URLs
###############################################################################

[project.urls]

Homepage = "https://github.com/matiasbelsito7/ai-software-engineering-team2"

Repository = "https://github.com/matiasbelsito7/ai-software-engineering-team2"

Issues = "https://github.com/matiasbelsito7/ai-software-engineering-team2/issues"

Documentation = "https://github.com/matiasbelsito7/ai-software-engineering-team2"

###############################################################################
# Ruff
###############################################################################

[tool.ruff]

target-version = "py312"
line-length = 100
indent-width = 4

src = ["src"]

exclude = [
    ".git",
    ".github",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    "dist",
    "build",
    "__pycache__",
]

[tool.ruff.lint]

select = [

    # pycodestyle
    "E",
    "W",

    # Pyflakes
    "F",

    # Import sorting (reemplaza isort)
    "I",

    # flake8-bugbear
    "B",

    # comprehensions
    "C4",

    # pyupgrade
    "UP",

    # simplificaciones
    "SIM",

    # performance
    "PERF",

    # pathlib
    "PTH",

    # logging
    "G",

    # debugger
    "T10",

    # type-checking imports
    "TCH",

    # Ruff specific
    "RUF",
]

ignore = [

    # Black se ocupa del largo de línea
    "E501",

    # Permitimos defaults con llamadas (FastAPI)
    "B008",

]

fixable = ["ALL"]

unfixable = []

[tool.ruff.lint.per-file-ignores]

"tests/**/*.py" = [
    "S101",   # asserts
]

"__init__.py" = [
    "F401",   # re-export
]

###############################################################################
# Black
###############################################################################

[tool.black]

line-length = 100

target-version = [
    "py312",
]

include = '\.pyi?$'

exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | htmlcov
  | \.pytest_cache
  | \.ruff_cache
  | \.mypy_cache
)/
'''

###############################################################################
# MyPy
###############################################################################

[tool.mypy]

python_version = "3.12"

plugins = []

strict = true

pretty = true
show_error_codes = true
show_column_numbers = true
show_absolute_path = false

warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true

check_untyped_defs = true

namespace_packages = true

explicit_package_bases = true

mypy_path = "src"

exclude = [
    "^tests/",
]

###############################################################################
# Third-party libraries without typing
###############################################################################

[[tool.mypy.overrides]]

module = [
    "langgraph.*",
    "llama_index.*",
    "qdrant_client.*",
    "qdrant_client",
    "deepeval.*",
    "docker",
    "docker.*",
    "playwright.*",
]

ignore_missing_imports = true

[[tool.mypy.overrides]]

module = [
    "docker",
    "docker.*",
    "qdrant_client",
    "qdrant_client.*",
]

follow_imports = "skip"

###############################################################################
# OpenTelemetry
###############################################################################

[[tool.mypy.overrides]]

module = [
    "opentelemetry.*",
]

ignore_missing_imports = true

###############################################################################
# Optional Providers
###############################################################################

[[tool.mypy.overrides]]

module = [
    "anthropic.*",
    "openai.*",
]

ignore_missing_imports = true

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
    "--cov=src/ai_team",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

filterwarnings = [
    "ignore::DeprecationWarning",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "llm: Tests requiring LLM providers",
    "rag: Retrieval-Augmented Generation tests",
]

###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]

branch = true

source = [
    "src/ai_team",
]

omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]

show_missing = true
skip_covered = false
fail_under = 25

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.coverage.html]

directory = "htmlcov"

###############################################################################
# Hatch
###############################################################################

[tool.hatch.build.targets.wheel]

packages = [
    "src/ai_team",
]

[tool.hatch.build.targets.sdist]

include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

###############################################################################
# uv
###############################################################################

[tool.uv]

package = true

default-groups = [
    "dev",
]

###############################################################################
# Tool Configuration
###############################################################################

[tool.typer]

pretty_exceptions_enable = true

###############################################################################
# Future compatibility
###############################################################################

[tool.langsmith]

# Placeholder para configuración futura.
# La autenticación se realiza mediante variables de entorno:
#
# LANGCHAIN_API_KEY
# LANGCHAIN_PROJECT
# LANGCHAIN_TRACING_V2=true

###############################################################################
# End of file
###############################################################################